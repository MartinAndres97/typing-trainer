<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Trainer - PDF Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        #btn-next {
            background-color: #45475a;
            color: #7f849c;
        }
        #btn-next:enabled {
            background-color: #a6e3a1;
            color: #11111b;
        }
        .stats { font-weight: bold; color: #a6e3a1; }
        #typing-container {
            flex: 1;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-size: 20px;
            padding: 32px;
            outline: none;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            border: none;
        }
        .pending { color: #7f849c; }
        .correct { color: #a6e3a1; }
        .current { color: #cdd6f4; background-color: #45475a; }
        .error { color: #11111b; background-color: #f38ba8; }
    </style>
</head>
<body>

    <header>
        <button id="btn-load">📂 Load PDF Book</button>
        <input type="file" id="file-input" accept=".pdf" style="display: none;">
        <button id="btn-next" disabled>Next ➔</button>
        <span id="lbl-info">No book loaded</span>
        <span class="stats" id="lbl-stats">WPM: 0.0 | Accuracy: 0.0%</span>
    </header>

    <div id="typing-container" tabindex="0"></div>

    <script>
        const container = document.getElementById('typing-container');
        const btnLoad = document.getElementById('btn-load');
        const fileInput = document.getElementById('file-input');
        const btnNext = document.getElementById('btn-next');
        const lblInfo = document.getElementById('lbl-info');
        const lblStats = document.getElementById('lbl-stats');

        let bookTitle = "";
        let blocks = [];
        let currentBlockIndex = 0;
        let currentText = "";
        let currentIndex = 0;
        let totalKeystrokes = 0;
        let correctKeystrokes = 0;
        let startTime = null;
        let errorAtCursor = false;

        window.addEventListener('load', () => {
            const savedSession = localStorage.getItem('typing_trainer_session');
            if (savedSession) {
                try {
                    const data = JSON.parse(savedSession);
                    bookTitle = data.bookTitle;
                    blocks = data.blocks;
                    currentBlockIndex = data.currentBlockIndex;
                    loadBlock();
                } catch (e) {
                    console.error("Error loading saved session", e);
                }
            }
        });

        function saveSession() {
            if (!bookTitle) return;
            localStorage.setItem('typing_trainer_session', JSON.stringify({ bookTitle, blocks, currentBlockIndex }));
        }

        btnLoad.addEventListener('click', () => { fileInput.click(); });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            bookTitle = file.name.replace(/\.[^/.]+$/, "");
            lblInfo.textContent = "Processing PDF...";
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += textContent.items.map(item => item.str).join(" ") + " ";
                }

                const cleaned = fullText.replace(/[^a-zA-Z0-9\s.,!?\'"-]/g, ' ').replace(/\s+/g, ' ').trim();
                const words = cleaned.split(' ');
                blocks = [];
                const chunkSize = 100;
                
                for (let i = 0; i < words.length; i += chunkSize) {
                    const chunk = words.slice(i, i + chunkSize).join(' ');
                    if (chunk.length > 10) blocks.push(chunk);
                }

                if (blocks.length === 0) {
                    alert("Could not extract legible text from this PDF.");
                    return;
                }

                currentBlockIndex = 0;
                saveSession();
                loadBlock();
            } catch (err) {
                console.error(err);
                alert("Error reading local PDF file.");
            }
        });

        function loadBlock() {
            if (currentBlockIndex >= blocks.length) {
                lblInfo.textContent = "Book completed!";
                currentText = "You have finished the entire book!";
                renderText();
                btnNext.setAttribute('disabled', 'true');
                return;
            }

            currentText = blocks[currentBlockIndex];
            currentIndex = 0;
            totalKeystrokes = 0;
            correctKeystrokes = 0;
            startTime = null;
            errorAtCursor = false;

            lblInfo.textContent = `Book: ${bookTitle} | Block ${currentBlockIndex + 1}/${blocks.length}`;
            renderText();
            btnNext.setAttribute('disabled', 'true');
            container.focus();
        }

        btnNext.addEventListener('click', () => {
            currentBlockIndex++;
            saveSession();
            loadBlock();
        });

        container.addEventListener('click', (e) => {
            const range = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
            if (range && currentText) {
                const pos = range.startOffset;
                if (pos <= currentText.length) {
                    currentIndex = pos;
                    errorAtCursor = false;
                    renderText();
                    checkProgress();
                }
            }
            container.focus();
        });

        window.addEventListener('keydown', (e) => {
            if (!currentText || currentIndex >= currentText.length) return;
            if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;

            if (!startTime) startTime = Date.now();

            totalKeystrokes++;
            const expected = currentText[currentIndex];

            if (e.key === expected) {
                correctKeystrokes++;
                errorAtCursor = false;
                currentIndex++;
            } else {
                errorAtCursor = true;
            }

            renderText();
            checkProgress();
            updateStats();

            if (currentIndex >= currentText.length) {
                lblInfo.textContent = "Block completed! Click Next.";
            }
        });

        function renderText() {
            let html = "";
            for (let i = 0; i < currentText.length; i++) {
                const char = currentText[i] === ' ' ? '&nbsp;' : currentText[i];
                if (i < currentIndex) {
                    html += `<span class="correct">${char}</span>`;
                } else if (i === currentIndex) {
                    html += `<span class="${errorAtCursor ? 'error' : 'current'}">${char}</span>`;
                } else {
                    html += `<span class="pending">${char}</span>`;
                }
            }
            container.innerHTML = html;
        }

        function checkProgress() {
            if (!currentText) return;
            const progress = (currentIndex / currentText.length) * 100;
            if (progress >= 80.0 || currentIndex >= currentText.length) {
                btnNext.removeAttribute('disabled');
            } else {
                btnNext.setAttribute('disabled', 'true');
            }
        }

        function updateStats() {
            if (!startTime) return;
            const elapsedMin = (Date.now() - startTime) / 60000;
            const wpm = elapsedMin > 0 ? (currentIndex / 5) / elapsedMin : 0.0;
            const accuracy = totalKeystrokes > 0 ? (correctKeystrokes / totalKeystrokes) * 100 : 100.0;
            lblStats.textContent = `WPM: ${wpm.toFixed(1)} | Accuracy: ${accuracy.toFixed(1)}%`;
        }

        currentText = "Upload a PDF book using the top button to start practicing.";
        renderText();
        container.focus();
    </script>
</body>
</html>
