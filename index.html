<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Trainer - PDF Reader</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        #btn-next {
            background-color: #45475a;
            color: #7f849c;
        }
        #btn-next:enabled {
            background-color: #a6e3a1;
            color: #11111b;
        }
        .stats {
            font-weight: bold;
            color: #a6e3a1;
        }
        #typing-container {
            flex: 1;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-size: 20px;
            padding: 32px;
            outline: none;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            border: none;
        }
        .pending { color: #7f849c; }
        .correct { color: #a6e3a1; }
        .current { color: #cdd6f4; background-color: #45475a; }
        .error { color: #11111b; background-color: #f38ba8; }
    </style>
</head>
<body>

    <header>
        <button id="btn-load">Load / Resume PDF</button>
        <button id="btn-next" disabled>Next ➔</button>
        <span id="lbl-info">No book loaded</span>
        <span class="stats" id="lbl-stats">WPM: 0.0 | Accuracy: 0.0%</span>
    </header>

    <div id="typing-container" tabindex="0"></div>

    <script>
        // Frontend logic for mouse placement, 80% threshold Next button, and English messages
        const container = document.getElementById('typing-container');
        const btnLoad = document.getElementById('btn-load');
        const btnNext = document.getElementById('btn-next');
        const lblInfo = document.getElementById('lbl-info');
        const lblStats = document.getElementById('lbl-stats');

        let currentText = "";
        let currentIndex = 0;
        let totalKeystrokes = 0;
        let correctKeystrokes = 0;
        let startTime = null;
        let errorAtCursor = false;

        btnLoad.addEventListener('click', () => {
            alert("To load PDF files, please use the Python desktop version (main.py).");
        });

        btnNext.addEventListener('click', () => {
            alert("Moving to next block...");
        });

        // Allow clicking to move typing cursor
        container.addEventListener('click', (e) => {
            const range = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
            if (range && currentText) {
                const pos = range.startOffset;
                if (pos <= currentText.length) {
                    currentIndex = pos;
                    errorAtCursor = false;
                    renderText();
                    checkProgress();
                }
            }
            container.focus();
        });

        window.addEventListener('keydown', (e) => {
            if (!currentText || currentIndex >= currentText.length) return;
            if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;

            if (!startTime) {
                startTime = Date.now();
            }

            totalKeystrokes++;
            const expected = currentText[currentIndex];

            if (e.key === expected) {
                correctKeystrokes++;
                errorAtCursor = false;
                currentIndex++;
            } else {
                errorAtCursor = true;
            }

            renderText();
            checkProgress();
            updateStats();

            if (currentIndex >= currentText.length) {
                lblInfo.textContent = "Block completed!";
            }
        });

        function renderText() {
            let html = "";
            for (let i = 0; i < currentText.length; i++) {
                const char = currentText[i] === ' ' ? '&nbsp;' : currentText[i];
                if (i < currentIndex) {
                    html += `<span class="correct">${char}</span>`;
                } else if (i === currentIndex) {
                    const cls = errorAtCursor ? "error" : "current";
                    html += `<span class="${cls}">${char}</span>`;
                } else {
                    html += `<span class="pending">${char}</span>`;
                }
            }
            container.innerHTML = html;
        }

        function checkProgress() {
            if (!currentText) return;
            const progress = (currentIndex / currentText.length) * 100;
            if (progress >= 80.0 || currentIndex >= currentText.length) {
                btnNext.removeAttribute('disabled');
            } else {
                btnNext.setAttribute('disabled', 'true');
            }
        }

        function updateStats() {
            if (!startTime) return;
            const elapsedMin = (Date.now() - startTime) / 60000;
            const wpm = elapsedMin > 0 ? (currentIndex / 5) / elapsedMin : 0.0;
            const accuracy = totalKeystrokes > 0 ? (correctKeystrokes / totalKeystrokes) * 100 : 100.0;
            lblStats.textContent = `WPM: ${wpm.toFixed(1)} | Accuracy: ${accuracy.toFixed(1)}%`;
        }

        // Example initial text for testing interface
        currentText = "Welcome to the typing trainer application. Practice your speed and accuracy here.";
        renderText();
        container.focus();
    </script>
</body>
</html>
