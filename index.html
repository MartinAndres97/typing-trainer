<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Trainer Web</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    body {
        background-color: #1e1e2e;
        color: #cdd6f4;
        font-family: 'Courier New', Courier, monospace;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #11111b;
        padding: 15px 20px;
        border-radius: 8px;
        margin-bottom: 20px;
    }
    button, label.upload-btn {
        background: #89b4fa;
        color: #11111b;
        border: none;
        padding: 10px 15px;
        font-weight: bold;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover, label.upload-btn:hover {
        background: #b4befe;
    }
    input[type="file"] { display: none; }
    .stats {
        font-size: 16px;
        font-weight: bold;
        color: #a6e3a1;
    }
    #trainer-container {
        flex: 1;
        background: #11111b;
        border-radius: 8px;
        padding: 30px;
        font-size: 24px;
        line-height: 1.6;
        outline: none;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .pending { color: #7f849c; }
    .correct { color: #a6e3a1; }
    .current { background: #45475a; color: #cdd6f4; }
    .error { background: #f38ba8; color: #11111b; }
</style>
</head>
<body>

<header>
    <div>
        <label class="upload-btn">
            Cargar PDF <input type="file" id="pdf-upload" accept=".pdf">
        </label>
        <span id="info-text" style="margin-left: 15px;">Ningún libro cargado</span>
    </div>
    <div class="stats" id="stats-display">WPM: 0.0 | Precisión: 100%</div>
</header>

<div id="trainer-container" tabindex="0">
    <span class="pending">Carga un archivo PDF para empezar a practicar tu velocidad de tipeo...</span>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let blocks = [];
let currentBlockIdx = 0;
let text = "";
let pos = 0;
let startTime = null;
let totalKeys = 0;
let correctKeys = 0;
let isFinished = false;

document.getElementById('pdf-upload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('info-text').innerText = `Cargando ${file.name}...`;
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    
    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(" ") + " ";
    }

    // Limpiar y dividir en bloques de ~100 palabras
    fullText = fullText.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'");
    const words = fullText.replace(/\s+/g, ' ').trim().split(" ");
    
    blocks = [];
    for (let i = 0; i < words.length; i += 100) {
        blocks.push(words.slice(i, i + 100).join(" "));
    }

    currentBlockIdx = 0;
    loadBlock();
});

function loadBlock() {
    if (currentBlockIdx >= blocks.length) {
        document.getElementById('info-text').innerText = "¡Felicidades! Libro completado.";
        document.getElementById('trainer-container').innerHTML = "<span class='correct'>¡Has terminado todo el libro!</span>";
        return;
    }
    text = blocks[currentBlockIdx];
    pos = 0;
    startTime = null;
    totalKeys = 0;
    correctKeys = 0;
    isFinished = false;
    document.getElementById('info-text').innerText = `Bloque ${currentBlockIdx + 1} / ${blocks.length}`;
    renderText();
    document.getElementById('trainer-container').focus();
}

function renderText() {
    let html = "";
    for (let i = 0; i < text.length; i++) {
        if (i < pos) {
            html += `<span class="correct">${text[i]}</span>`;
        } else if (i === pos) {
            html += `<span class="current">${text[i]}</span>`;
        } else {
            html += `<span class="pending">${text[i]}</span>`;
        }
    }
    document.getElementById('trainer-container').innerHTML = html;
}

document.getElementById('trainer-container').addEventListener('keydown', function(e) {
    if (!text || isFinished) return;
    if (e.key.length !== 1) return; // Ignorar teclas de control

    if (!startTime) startTime = new Date();
    totalKeys++;

    if (e.key === text[pos]) {
        correctKeys++;
        pos++;
        if (pos >= text.length) {
            isFinished = true;
            currentBlockIdx++;
            setTimeout(loadBlock, 500); // Pasar al siguiente bloque
        }
    }

    renderText();
    updateStats();
});

function updateStats() {
    if (!startTime) return;
    const elapsedMin = (new Date() - startTime) / 60000;
    const wpm = elapsedMin > 0 ? (pos / 5) / elapsedMin : 0;
    const accuracy = totalKeys > 0 ? (correctKeys / totalKeys) * 100 : 100;
    document.getElementById('stats-display').innerText = `WPM: ${wpm.toFixed(1)} | Precisión: ${accuracy.toFixed(1)}%`;
}
</script>
</body>
</html>
